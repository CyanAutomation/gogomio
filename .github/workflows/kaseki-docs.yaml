name: Kaseki Docs Sweep

on:
  schedule:
    - cron: "0 2 * * 2"
  workflow_dispatch:

run-name: >-
  Docs sweep · ${{ github.repository }}@main

permissions:
  contents: read

concurrency:
  group: kaseki-docs-sweep-${{ github.repository }}-${{ github.ref == 'refs/heads/main' && 'main' || github.run_id }}
  cancel-in-progress: false

jobs:
  docs_sweep:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/kaseki-sweep.yml
    with:
      sweep_name: Documentation
      allowlist: README.md,docs/**/*.md
      validation_command: go test ./...
      task_prompt: |
        Keep README.md and docs/ accurate against the current implementation.

        Perform the documentation sweep for this repository. First read repository
        instructions, then inspect the current implementation and compare it against
        README.md and documentation under docs/. Update documentation only where
        inaccurate, incomplete, or stale. Do not modify application code, tests,
        configuration, dependencies, lockfiles, CI workflows, or generated files.
        Do not invent behavior. Avoid cosmetic rewrites. Before finishing, review the
        diff to confirm it contains documentation-only changes. If documentation is
        already accurate, make no changes and do not open a pull request.
