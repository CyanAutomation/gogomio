name: GoReleaser Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify-release:
    name: Validate and Test Release Source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/validate_release_tag.py "$RELEASE_TAG"

      - name: Reject release tag updates
        env:
          RELEASE_BEFORE: ${{ github.event.before }}
        run: python3 scripts/validate_release_tag_event.py "$RELEASE_BEFORE"

      - name: Fetch protected main branch
        run: git fetch origin main:refs/remotes/origin/main --force

      - name: Confirm release commit is reachable from main
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: python3 scripts/validate_release_source.py "$RELEASE_SHA" refs/remotes/origin/main

      - name: Check TypeScript UI and generated bundle
        run: |
          npm ci
          npm run check:web

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go vet and race tests
        run: bash scripts/test-go-ci.sh

  goreleaser:
    name: Build and Release Binaries
    needs: verify-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          release_notes="$RUNNER_TEMP/release-notes.md"
          if ! awk -v version="$version" '
            BEGIN { header = "## [" version "]" }
            index($0, header) == 1 && (length($0) == length(header) || substr($0, length(header) + 1, 1) == " ") { in_section=1; next }
            /^## \[/ && in_section { exit }
            in_section { print }
          ' CHANGELOG.md > "$release_notes" || [[ ! -s "$release_notes" ]]; then
            git log -1 --pretty=format:%B > "$release_notes"
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          version: v2.18.0
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
