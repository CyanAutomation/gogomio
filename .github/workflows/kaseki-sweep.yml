name: Kaseki Sweep via Soyuz

# Security contract: only kaseki-docs.yaml and kaseki-dry.yaml should call
# this reusable workflow. Treat its task_prompt, allowlist, and validation_command
# inputs as reviewed repository configuration, never event- or user-supplied values.
on:
  workflow_call:
    inputs:
      sweep_name:
        description: Short name shown in the job summary
        required: true
        type: string
      allowlist:
        description: Comma-separated set of paths Soyuz may change
        required: true
        type: string
      validation_command:
        description: Validation command Soyuz must run
        required: true
        type: string
      task_prompt:
        description: Instructions for this Kaseki sweep
        required: true
        type: string

permissions:
  contents: read

jobs:
  sweep:
    # Enforce the default branch here as well as in each caller.
    if: github.ref == 'refs/heads/main'
    name: Submit Kaseki ${{ inputs.sweep_name }} sweep to Soyuz
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Configure SOYUZ_BASE_URL and SOYUZ_SUBMISSION_API_TOKEN in this
    # environment and restrict it to main without required reviewers.
    environment: soyuz
    env:
      SOYUZ_BASE_URL: ${{ vars.SOYUZ_BASE_URL }}
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      REF: main
      SWEEP_NAME: ${{ inputs.sweep_name }}
      TASK_PROMPT: ${{ inputs.task_prompt }}
      ALLOWLIST: ${{ inputs.allowlist }}
      VALIDATION_COMMAND: ${{ inputs.validation_command }}
    steps:
      - name: Checkout workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Validate Soyuz URL
        shell: bash
        run: node --experimental-strip-types scripts/validate-soyuz-url.ts

      - name: Submit Kaseki sweep to Soyuz
        id: submit
        shell: bash
        env:
          SOYUZ_SUBMISSION_API_TOKEN: ${{ secrets.SOYUZ_SUBMISSION_API_TOKEN }}
        run: |
          set -euo pipefail
          : "${SOYUZ_SUBMISSION_API_TOKEN:?SOYUZ_SUBMISSION_API_TOKEN is not configured in the soyuz environment}"
          idempotency_key="$(tr '[:upper:]' '[:lower:]' < /proc/sys/kernel/random/uuid)"

          payload="$(
            jq -n \
              --arg repoUrl "$REPO_URL" \
              --arg ref "$REF" \
              --arg taskPrompt "$TASK_PROMPT" \
              --arg validationCommand "$VALIDATION_COMMAND" \
              --arg allowlist "$ALLOWLIST" \
              --arg idempotencyKey "$idempotency_key" \
              '{
                repoUrl: $repoUrl,
                ref: $ref,
                taskMode: "patch",
                publishMode: "pr",
                timeoutSeconds: 10800,
                maxDiffBytes: 102400,
                idempotencyKey: $idempotencyKey,
                changedFilesAllowlist: (
                  $allowlist
                  | split(",")
                  | map(gsub("^\\s+|\\s+$"; ""))
                  | map(select(length > 0))
                ),
                validationCommands: [$validationCommand],
                goalCheck: { enabled: true, maxRetries: 1 },
                taskPrompt: $taskPrompt
              }'
          )"

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_status="$(
            curl --proto '=https' --tlsv1.2 --fail-with-body --silent --show-error \
              --retry 3 --retry-all-errors --connect-timeout 10 --max-time 60 \
              --max-filesize 1048576 --output "$response_file" \
              --write-out '%{http_code}' \
              --request POST "$SOYUZ_BASE_URL/v1/runs" \
              --header "Authorization: Bearer $SOYUZ_SUBMISSION_API_TOKEN" \
              --header "Idempotency-Key: $idempotency_key" \
              --header 'Content-Type: application/json' \
              --data "$payload" || true
          )"

          if [[ ! "$http_status" =~ ^(200|202)$ ]]; then
            echo "::error title=Soyuz submission failed::Soyuz returned HTTP $http_status"
            echo "Soyuz returned HTTP \`$http_status\`. Response body omitted." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          run_id="$(jq -er '.data.id | strings' "$response_file")"
          run_id="$(SOYUZ_RUN_ID="$run_id" node --experimental-strip-types scripts/validate-soyuz-run-id.ts)"
          display_id="$(jq -er '.data.displayId | strings | select(test("^soyuz-[0-9]+$"))' "$response_file")"
          run_status="$(jq -er '.data.status | strings | select(test("^(admitting|queued|claimed|running|cancel_requested|cancelled|completed|failed|admission_failed)$"))' "$response_file")"
          {
            printf 'run_id=%s\n' "$run_id"
            printf 'display_id=%s\n' "$display_id"
            printf 'run_status=%s\n' "$run_status"
            printf 'submission_status=accepted\n'
          } >> "$GITHUB_OUTPUT"
          echo "Soyuz accepted the Kaseki $SWEEP_NAME sweep as $display_id."

      - name: Publish Soyuz submission details
        if: always()
        shell: bash
        env:
          RUN_ID: ${{ steps.submit.outputs.run_id || 'not submitted' }}
          DISPLAY_ID: ${{ steps.submit.outputs.display_id || 'not assigned' }}
          RUN_STATUS: ${{ steps.submit.outputs.run_status || 'not received' }}
          SUBMISSION_STATUS: ${{ steps.submit.outputs.submission_status || 'not accepted' }}
        run: |
          {
            echo "## Kaseki $SWEEP_NAME submission to Soyuz"
            echo
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Repository | \`$REPO_URL\` |"
            echo "| Ref | \`$REF\` |"
            echo "| Allowed paths | \`$ALLOWLIST\` |"
            echo "| Validation | \`$VALIDATION_COMMAND\` |"
            echo "| Submission | \`$SUBMISSION_STATUS\` |"
            echo "| Soyuz run | \`$DISPLAY_ID\` (\`$RUN_ID\`) |"
            echo "| Run status at submission | \`$RUN_STATUS\` |"
            echo
            echo "Accepted means Soyuz admitted the task; it does not confirm execution completion. Monitor the run in the Soyuz dashboard."
          } >> "$GITHUB_STEP_SUMMARY"
