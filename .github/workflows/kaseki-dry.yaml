name: Kaseki DRY Sweep

on:
  schedule:
    - cron: "0 1 * * 6"
  workflow_dispatch:

run-name: >-
  DRY sweep · ${{ github.repository }}@main

permissions:
  contents: read

concurrency:
  group: kaseki-dry-sweep-${{ github.repository }}
  cancel-in-progress: false

jobs:
  dry_sweep:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/kaseki-sweep.yml
    with:
      sweep_name: DRY
      allowlist: cmd/**/*,internal/**/*,scripts/**/*
      validation_command: go test ./...
      task_prompt: |
        Perform a conservative DRY-principle review of this repository.

        Look for duplicated knowledge rather than merely duplicated text. Strong
        candidates include repeated business rules, validation rules, constants,
        configuration knowledge, parsing or normalisation logic, transformations,
        and substantially identical implementations that must remain synchronised.

        Do not assume that all repetition violates DRY. Similar-looking code may
        represent separate concepts or may need to evolve independently. Prefer clear
        duplication over an abstraction that increases coupling, indirection, or
        cognitive load.

        Identify the single strongest DRY improvement available. Only act when the
        duplication represents the same underlying knowledge and consolidation has a
        clear maintenance benefit.

        Prefer reusing an existing abstraction. If a new abstraction is justified,
        keep it at the narrowest sensible scope.

        Make at most one focused refactoring.

        A no-change result is successful. If there is no sufficiently valuable,
        high-confidence DRY improvement, make no changes.
