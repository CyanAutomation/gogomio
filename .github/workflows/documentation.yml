name: Documentation

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown:
    name: Markdown and link checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Lint canonical documentation
        uses: DavidAnson/markdownlint-cli2-action@992badcdf24e3b8eb7e87ff9287fe931bcb00c6e # v20
        with:
          config: .markdownlint-cli2.jsonc
          globs: |
            README.md
            CONTRIBUTING.md
            docs/README.md
            docs/guides/*.md

      - name: Check canonical documentation links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          lycheeVersion: v0.24.2
          args: >-
            --verbose --no-progress --exclude-loopback --retry-wait-time 2 --accept 200..=299,403,429
            README.md CONTRIBUTING.md docs/README.md 'docs/guides/*.md'
