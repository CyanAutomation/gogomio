name: Build Multi-Architecture Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tags:
        description: 'Docker image tags (comma-separated, e.g., latest,0.2.0)'
        required: false
        default: 'latest'

env:
  # Opt into Node.js 24 to proactively support the latest runtime
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Default least-privilege token for all jobs in this workflow.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag_names_csv: ${{ steps.meta.outputs.tag_names_csv }}
    permissions:
      # Required for `cache-to: type=gha` to upload BuildKit cache to GitHub Actions cache storage.
      actions: write
      # Required for actions/checkout to clone the repository.
      contents: read
    
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Determine tags
        id: meta
        env:
          INPUT_TAGS: ${{ inputs.tags }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            requested_tags="$INPUT_TAGS"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            python3 scripts/validate_release_tag.py "$GITHUB_REF_NAME"
            requested_tags="${GITHUB_REF_NAME},latest"
          else
            requested_tags=latest
          fi

          docker_tags="$(bash scripts/docker-tags.sh "$requested_tags")"
          docker_tag_names_csv="$(printf '%s\n' "$docker_tags" | bash scripts/docker-tag-names.sh)"
          {
            echo 'tags<<EOF'
            printf '%s\n' "$docker_tags"
            echo EOF
            # Do not pass the image namespace through a job output: it may match a secret.
            printf 'tag_names_csv=%s\n' "$docker_tag_names_csv"
          } >> "$GITHUB_OUTPUT"
          printf 'Building tags (multi-arch and arm64-specific):\n%s\n' "$docker_tags"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify:
    needs: build
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG_NAMES_CSV: ${{ needs.build.outputs.tag_names_csv }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Verify multi-arch manifest
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$IMAGE_TAG_NAMES_CSV" ]]; then
            echo '::error::Build job did not provide any image tags.'
            exit 1
          fi

          IFS=',' read -r -a image_tag_names <<<"$IMAGE_TAG_NAMES_CSV"
          verified=0
          for image_tag in "${image_tag_names[@]}"; do
            [[ -n "$image_tag" ]] || continue
            image="cyanautomation/gogomio:$image_tag"
            echo "Verifying manifest for $image"
            manifest="$(docker buildx imagetools inspect --raw "$image")"
            python3 scripts/verify_docker_manifest.py <<<"$manifest"
            verified=$((verified + 1))
          done

          if (( verified == 0 )); then
            echo '::error::No image manifests were verified.'
            exit 1
          fi
          echo "Verified $verified image manifest(s) for linux/amd64 and linux/arm64."
