name: Build Multi-Architecture Docker Image

on:
  workflow_dispatch:
    inputs:
      image_version_tag:
        description: 'Existing v-prefixed Git tag to include as a Docker image tag (optional)'
        required: false
        default: ''
        type: string
      tags:
        description: 'Additional Docker image tags (comma-separated; defaults to latest)'
        required: false
        default: 'latest'
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  # Serialize manual image publishes because version tags can also update `latest`.
  group: docker-publish-${{ github.repository }}-manual
  cancel-in-progress: false

jobs:
  validate:
    name: Validate source and tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      source_sha: ${{ steps.validate-source.outputs.source_sha || steps.manual-source.outputs.source_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate image version tag and source
        id: validate-source
        if: inputs.image_version_tag != ''
        env:
          IMAGE_VERSION_TAG: ${{ inputs.image_version_tag }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_release_tag.py "$IMAGE_VERSION_TAG"
          git fetch origin "refs/tags/${IMAGE_VERSION_TAG}:refs/tags/${IMAGE_VERSION_TAG}" --force
          git fetch origin main:refs/remotes/origin/main --force
          image_source_sha="$(git rev-parse --verify "${IMAGE_VERSION_TAG}^{commit}")"
          python3 scripts/validate_release_source.py "$image_source_sha" refs/remotes/origin/main
          echo "source_sha=$image_source_sha" >> "$GITHUB_OUTPUT"

      - name: Select manually dispatched source
        id: manual-source
        if: inputs.image_version_tag == ''
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.validate-source.outputs.source_sha || steps.manual-source.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Validate manual tags
        env:
          INPUT_TAGS: ${{ inputs.tags }}
        run: python3 scripts/validate_docker_dispatch_tags.py "$INPUT_TAGS"

      - name: Run shared CI helper tests
        run: bash scripts/test-ci-helpers.sh

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go vet and race tests
        run: bash scripts/test-go-ci.sh

  build:
    name: Build and push candidate image
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    outputs:
      tag_names_csv: ${{ steps.meta.outputs.tag_names_csv }}
      digest: ${{ steps.build.outputs.digest }}
      amd64_digest: ${{ steps.platform-digests.outputs.amd64_digest }}
      arm64_digest: ${{ steps.platform-digests.outputs.arm64_digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Build and verify embedded web UI
        run: |
          npm ci
          npm run build:web
          npm run check:web

      - name: Determine requested tags
        id: meta
        env:
          INPUT_TAGS: ${{ inputs.tags }}
          IMAGE_VERSION_TAG: ${{ inputs.image_version_tag }}
        shell: bash
        run: |
          set -euo pipefail
          requested_tags="$(python3 scripts/validate_docker_dispatch_tags.py "$INPUT_TAGS")"
          if [[ -n "$IMAGE_VERSION_TAG" ]]; then
            python3 scripts/validate_release_tag.py "$IMAGE_VERSION_TAG"
            requested_tags="${IMAGE_VERSION_TAG},${requested_tags}"
          fi

          final_image_tags="$(bash scripts/docker-tags.sh "$requested_tags")"
          tag_names_csv="$(printf '%s\n' "$final_image_tags" | bash scripts/docker-tag-names.sh)"
          candidate_tag="candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            printf 'tag_names_csv=%s\n' "$tag_names_csv"
            printf 'candidate_tag=%s\n' "$candidate_tag"
          } >> "$GITHUB_OUTPUT"
          printf 'Candidate tag: %s\nFinal tags:\n%s\n' "$candidate_tag" "$final_image_tags"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build candidate and generate attestations
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: cyanautomation/gogomio:${{ steps.meta.outputs.candidate_tag }}
          pull: true
          sbom: true
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve candidate platform digests
        id: platform-digests
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          : "${IMAGE_DIGEST:?Build did not return an image digest}"
          docker buildx imagetools inspect --raw "cyanautomation/gogomio@$IMAGE_DIGEST" \
            | python3 scripts/verify_docker_manifest.py --github-output "$GITHUB_OUTPUT"

  verify:
    name: Verify candidate manifest
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
    steps:
      - name: Checkout manifest verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Optional read-only robot credentials avoid anonymous Docker Hub pull limits.
      # Configure DOCKERHUB_READONLY_USERNAME and DOCKERHUB_READONLY_TOKEN if needed.
      - name: Check for optional Docker Hub pull credentials
        id: pull-credentials
        shell: bash
        env:
          DOCKERHUB_READONLY_USERNAME: ${{ secrets.DOCKERHUB_READONLY_USERNAME }}
          DOCKERHUB_READONLY_TOKEN: ${{ secrets.DOCKERHUB_READONLY_TOKEN }}
        run: |
          if [[ -n "$DOCKERHUB_READONLY_USERNAME" && -n "$DOCKERHUB_READONLY_TOKEN" ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          elif [[ -n "$DOCKERHUB_READONLY_USERNAME" || -n "$DOCKERHUB_READONLY_TOKEN" ]]; then
            echo "::error::Configure both DOCKERHUB_READONLY_USERNAME and DOCKERHUB_READONLY_TOKEN, or leave both unset."
            exit 1
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Docker Hub for pull access
        if: steps.pull-credentials.outputs.configured == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_READONLY_USERNAME }}
          password: ${{ secrets.DOCKERHUB_READONLY_TOKEN }}

      - name: Verify linux/amd64 and linux/arm64 on the immutable digest
        shell: bash
        run: |
          set -euo pipefail
          : "${IMAGE_DIGEST:?Build did not return an image digest}"
          docker buildx imagetools inspect --raw "cyanautomation/gogomio@$IMAGE_DIGEST" \
            | python3 scripts/verify_docker_manifest.py

  scan:
    name: Scan candidate vulnerabilities (${{ matrix.architecture }})
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    steps:
      - name: Check for optional Docker Hub pull credentials
        id: pull-credentials
        shell: bash
        env:
          DOCKERHUB_READONLY_USERNAME: ${{ secrets.DOCKERHUB_READONLY_USERNAME }}
          DOCKERHUB_READONLY_TOKEN: ${{ secrets.DOCKERHUB_READONLY_TOKEN }}
        run: |
          if [[ -n "$DOCKERHUB_READONLY_USERNAME" && -n "$DOCKERHUB_READONLY_TOKEN" ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          elif [[ -n "$DOCKERHUB_READONLY_USERNAME" || -n "$DOCKERHUB_READONLY_TOKEN" ]]; then
            echo "::error::Configure both DOCKERHUB_READONLY_USERNAME and DOCKERHUB_READONLY_TOKEN, or leave both unset."
            exit 1
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Docker Hub for pull access
        if: steps.pull-credentials.outputs.configured == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_READONLY_USERNAME }}
          password: ${{ secrets.DOCKERHUB_READONLY_TOKEN }}

      - name: Scan candidate image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cyanautomation/gogomio@${{ matrix.architecture == 'amd64' && needs.build.outputs.amd64_digest || needs.build.outputs.arm64_digest }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          version: v0.75.0

  promote:
    name: Promote verified image digest
    needs: [validate, build, verify, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
      IMAGE_TAG_NAMES_CSV: ${{ needs.build.outputs.tag_names_csv }}
    steps:
      - name: Checkout manifest verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to Docker Hub for publishing
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Promote the verified digest to final tags
        shell: bash
        run: |
          set -euo pipefail
          : "${IMAGE_DIGEST:?Build did not return an image digest}"
          : "${IMAGE_TAG_NAMES_CSV:?No final image tags were selected}"
          IFS=',' read -r -a image_tags <<< "$IMAGE_TAG_NAMES_CSV"
          for image_tag in "${image_tags[@]}"; do
            [[ -n "$image_tag" ]] || continue
            docker buildx imagetools create \
              --tag "cyanautomation/gogomio:$image_tag" \
              "cyanautomation/gogomio@$IMAGE_DIGEST"
            docker buildx imagetools inspect --raw "cyanautomation/gogomio:$image_tag" \
              | python3 scripts/verify_docker_manifest.py
          done
