name: Build Multi-Architecture Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tags:
        description: 'Docker image tags (comma-separated; manual runs cannot publish v-prefixed release tags)'
        required: false
        default: 'latest'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate source and tests
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release source
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_release_tag.py "$RELEASE_TAG"
          python3 scripts/validate_release_tag_event.py "$RELEASE_BEFORE"
          git fetch origin main:refs/remotes/origin/main --force
          python3 scripts/validate_release_source.py "$RELEASE_SHA" refs/remotes/origin/main

      - name: Validate manual tags
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_TAGS: ${{ inputs.tags }}
        run: python3 scripts/validate_docker_dispatch_tags.py "$INPUT_TAGS"

      - name: Validate helper scripts and workflow contracts
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/test-docker-tags.sh
          bash scripts/test-docker-go-tests.sh
          python3 -B -m unittest discover -s scripts -p 'test_*.py'
          node --test internal/web/aspect-ratio.test.js

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go vet and race tests
        run: |
          go vet ./...
          go test ./... -race

  build:
    name: Build and push candidate image
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    outputs:
      tag_names_csv: ${{ steps.meta.outputs.tag_names_csv }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Determine requested tags
        id: meta
        env:
          INPUT_TAGS: ${{ inputs.tags }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            requested_tags="$(python3 scripts/validate_docker_dispatch_tags.py "$INPUT_TAGS")"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            python3 scripts/validate_release_tag.py "$GITHUB_REF_NAME"
            requested_tags="${GITHUB_REF_NAME},latest"
          else
            requested_tags=latest
          fi

          final_image_tags="$(bash scripts/docker-tags.sh "$requested_tags")"
          tag_names_csv="$(printf '%s\n' "$final_image_tags" | bash scripts/docker-tag-names.sh)"
          candidate_tag="candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            printf 'tag_names_csv=%s\n' "$tag_names_csv"
            printf 'candidate_tag=%s\n' "$candidate_tag"
          } >> "$GITHUB_OUTPUT"
          printf 'Candidate tag: %s\nFinal tags:\n%s\n' "$candidate_tag" "$final_image_tags"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build candidate and generate attestations
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: cyanautomation/gogomio:${{ steps.meta.outputs.candidate_tag }}
          sbom: true
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify:
    name: Verify candidate manifest
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
    steps:
      - name: Checkout manifest verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Verify linux/amd64 and linux/arm64 on the immutable digest
        shell: bash
        run: |
          set -euo pipefail
          : "${IMAGE_DIGEST:?Build did not return an image digest}"
          docker buildx imagetools inspect --raw "cyanautomation/gogomio@$IMAGE_DIGEST" \
            | python3 scripts/verify_docker_manifest.py

  scan:
    name: Scan candidate vulnerabilities
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Scan candidate image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cyanautomation/gogomio@${{ needs.build.outputs.digest }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

  promote:
    name: Promote verified image digest
    needs: [validate, build, verify, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
      IMAGE_TAG_NAMES_CSV: ${{ needs.build.outputs.tag_names_csv }}
    steps:
      - name: Checkout manifest verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Promote the verified digest to final tags
        shell: bash
        run: |
          set -euo pipefail
          : "${IMAGE_DIGEST:?Build did not return an image digest}"
          : "${IMAGE_TAG_NAMES_CSV:?No final image tags were selected}"
          IFS=',' read -r -a image_tags <<< "$IMAGE_TAG_NAMES_CSV"
          for image_tag in "${image_tags[@]}"; do
            [[ -n "$image_tag" ]] || continue
            docker buildx imagetools create \
              --tag "cyanautomation/gogomio:$image_tag" \
              "cyanautomation/gogomio@$IMAGE_DIGEST"
            docker buildx imagetools inspect --raw "cyanautomation/gogomio:$image_tag" \
              | python3 scripts/verify_docker_manifest.py
          done
