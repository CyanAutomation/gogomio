name: Benchmarks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9 AM UTC

permissions:
  actions: read
  contents: read

jobs:
  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Find latest successful main benchmark run
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(gh run list --workflow benchmark.yml --branch main --status success --limit 50 --json databaseId --jq '.[0].databaseId // empty')"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download previous benchmark baseline
        if: steps.baseline.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: benchmark-results
          path: baseline
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.baseline.outputs.run_id }}

      - name: Download dependencies
        run: go mod download

      - name: Run benchmarks
        id: run-benchmarks
        shell: bash
        run: |
          set -euo pipefail
          if go test -run='^$' -bench=. -benchmem -benchtime=1s -count=10 ./... \
            > bench-current.txt 2> benchmark-diagnostics.txt; then
            rm -f benchmark-diagnostics.txt
          else
            status=$?
            echo "::error::Benchmark command failed with exit code $status."
            echo 'Recent benchmark output:'
            tail -n 100 bench-current.txt || true
            tail -n 100 benchmark-diagnostics.txt || true
            exit "$status"
          fi

      - name: Install benchstat
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install golang.org/x/perf/cmd/benchstat@v0.0.0-20260211190930-8161c38c6cdc

      - name: Compare benchmarks and check regressions
        id: compare
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s baseline/bench-current.txt ]]; then
            "$RUNNER_TEMP/bin/benchstat" baseline/bench-current.txt bench-current.txt > bench-comparison.txt
            cat bench-comparison.txt
            python3 scripts/check_benchstat.py bench-comparison.txt --threshold-percent 10 --alpha 0.05
          else
            echo 'No downloadable successful main-branch baseline is available; this run will establish one.'
            echo 'Benchmark comparison skipped because no baseline is available.' > bench-comparison.txt
          fi

      - name: Upload benchmark results
        if: always() && steps.run-benchmarks.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-results
          path: |
            bench-current.txt
            benchmark-diagnostics.txt
          if-no-files-found: ignore
          retention-days: 90

      - name: Publish benchmark summary
        if: always()
        env:
          BENCHMARK_OUTCOME: ${{ steps.run-benchmarks.outcome }}
          COMPARE_OUTCOME: ${{ steps.compare.outcome }}
        shell: bash
        run: |
          {
            echo '## Benchmark comparison'
            echo
            echo "Benchmark step: $BENCHMARK_OUTCOME"
            echo "Comparison step: $COMPARE_OUTCOME"
            if [[ "$BENCHMARK_OUTCOME" != 'success' ]]; then
              echo 'Benchmark execution failed; see the Run benchmarks step and benchmark-results artifact.'
            fi
            if [[ -f bench-comparison.txt ]]; then
              echo 'Detailed comparison is available in the job log.'
            elif [[ -f bench-current.txt ]]; then
              echo 'The benchmark completed without a comparison report.'
            else
              echo 'No benchmark results were produced.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
